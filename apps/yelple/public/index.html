<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yelple</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top-nav">
      <div class="top-nav-inner">
        <div class="nav-left">
          <a class="brand-logo brand-link" href="/" aria-label="Yelple">
            <span class="brand-word">yelple</span>
            <span class="brand-burst" aria-hidden="true">
              <img src="/favicon.svg" alt="" />
            </span>
          </a>
          <p id="challengeDate" class="subtle nav-date"></p>
        </div>
        <div class="nav-right">
          <button id="menuToggleBtn" class="menu-toggle-btn" type="button" aria-label="Open menu" aria-expanded="false">☰</button>
          <div id="navMenu" class="nav-menu" hidden>
            <a class="nav-menu-item" href="/archive.html">Archive games</a>
            <a id="todayGameBtn" class="nav-menu-item" href="/" hidden>Today</a>
            <div class="nav-menu-footer">
              <a class="nav-menu-legal-link" href="/terms.html">Terms</a>
              <a class="nav-menu-legal-link" href="/privacy.html">Privacy</a>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="card" id="gameCard">
        <div class="review-carousel">
          <div id="hintsList" class="hint-cards"></div>
        </div>

        <div class="guess-row" id="guessButtons"></div>
        <p id="message" class="message"></p>
      </section>
    </main>

    <dialog id="photoDialog" class="photo-dialog" aria-label="Expanded review photo">
      <button id="photoDialogCloseBtn" class="photo-dialog-close" type="button" aria-label="Close photo viewer">✕</button>
      <div class="photo-dialog-stage">
        <button id="photoDialogPrevBtn" class="photo-dialog-nav photo-dialog-prev" type="button" aria-label="Previous photo">←</button>
        <img id="photoDialogImage" class="photo-dialog-image" alt="Expanded review photo" />
        <button id="photoDialogNextBtn" class="photo-dialog-nav photo-dialog-next" type="button" aria-label="Next photo">→</button>
      </div>
      <p id="photoDialogCaption" class="photo-dialog-caption"></p>
    </dialog>

    <dialog id="resultsDialog" class="results-dialog" aria-label="Game results">
      <button id="resultsDialogCloseBtn" class="results-dialog-close" type="button" aria-label="Close results">✕</button>
      <h2 id="resultsTitle" class="results-title"></h2>
      <div class="results-map-wrap">
        <iframe
          id="resultsMap"
          class="results-map"
          title="Restaurant location map"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </div>
      <div class="results-body">
        <p id="resultsSummary" class="results-summary"></p>
        <p id="resultsBusinessName" class="results-business-name"></p>
        <p id="resultsBusinessMeta" class="results-business-meta"></p>
        <a id="resultsYelpLink" class="results-yelp-link" href="#" target="_blank" rel="noopener noreferrer" hidden>View on Yelp</a>
      </div>
    </dialog>

    <script src="/app.js"></script>
  </body>
</html>
